name: Tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      # Tiny generated archives and fake child processes; no model downloads.
      - run: python -m pytest tests/test_demo_models.py tests/test_run_console.py -q -p no:cacheprovider --basetemp="${{ runner.temp }}/model-tools-pytest"

  web-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DETECTOR_BACKEND: mock
      EVENT_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q -p no:cacheprovider --basetemp="${{ runner.temp }}/web-pytest"

  web-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-console
    env:
      PYTHONPATH: platevision/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop-console/platevision/backend/requirements.txt
      - run: python -m pip install -r platevision/backend/requirements.txt
      # Synthetic/mocked unit suites: no trained checkpoints or GPU required.
      - run: python -m pytest platevision/backend/tests tests -q -p no:cacheprovider --basetemp="${{ runner.temp }}/desktop-pytest"

  desktop-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-isolation=none tests/video-analysis.test.cjs tests/region-mode.test.cjs tests/reid-ui.test.cjs tests/green-enhancement.test.cjs
